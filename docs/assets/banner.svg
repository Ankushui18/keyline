<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Keyline</title>
  <desc id="banner-desc">Keyline wordmark with a construction mark: a square, a circle and a keyline guide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#1b1d22"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d99ff"/>
      <stop offset="1" stop-color="#5ac8fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- construction mark -->
  <g transform="translate(132 180)">
    <circle r="86" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <rect x="-64" y="-64" width="128" height="128" fill="none" stroke="#ececee" stroke-width="3.5"/>
    <circle r="46" fill="none" stroke="#ececee" stroke-width="3.5"/>
    <rect x="40" y="-84" width="26" height="26" fill="url(#accent)"/>
    <path d="M-96 0H96M0 -96V96" stroke="#0d99ff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text x="272" y="163" fill="#f5f6f8" font-size="92" font-weight="700" letter-spacing="-2">Keyline</text>
    <text x="276" y="216" fill="#b9bfc9" font-size="26" letter-spacing="0.2">A local-first parametric vector editor for precision icon work.</text>
    <g fill="#7e8794" font-size="17" letter-spacing="1.6">
      <text x="276" y="270">NATIVE ARCS</text>
      <text x="412" y="270">CONSTRAINTS</text>
      <text x="558" y="270">WASM SOLVER</text>
      <text x="700" y="270">OFFLINE-FIRST</text>
    </g>
    <g fill="#0d99ff">
      <circle cx="264" cy="265" r="3.5"/><circle cx="400" cy="265" r="3.5"/><circle cx="546" cy="265" r="3.5"/><circle cx="688" cy="265" r="3.5"/>
    </g>
  </g>
</svg>
