[package]
name = "vector-solver"
version = "0.1.0"
edition = "2021"
description = "Deterministic geometric constraint solver for Keyline"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
